<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="داشبورد تحلیل پیشرفته سئو برای تحلیل کلمات کلیدی، Google Search Console، ساختار صفحات و شکاف محتوایی رقبا.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#6366f1">
    <title>داشبورد تحلیل پیشرفته سئو برای تحلیل کلمات کلیدی</title>
    <style>
        /* Import Vazirmatn Font */
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap');

        :root {
            /* Pastel Palette */
            --bg-main: #f8fafc;
            --bg-surface: #ffffff;
            --bg-neutral-light: #f1f5f9;
            --border-subtle: #e2e8f0;
            --border-active: #818cf8;
            
            --text-heading: #1e1b4b;
            --text-body: #334155;
            --text-muted: #64748b;
            
            --primary: #6366f1;
            --primary-light: #e0e7ff;
            --primary-hover: #4f46e5;
            
            --accent-emerald: #059669;
            --accent-emerald-bg: #d1fae5;
            --accent-amber: #d97706;
            --accent-amber-bg: #fef3c7;
            --accent-rose: #e11d48;
            --accent-rose-bg: #ffe4e6;
            --accent-sky: #0284c7;
            --accent-sky-bg: #e0f2fe;
            --accent-purple: #7c3aed;
            --accent-purple-bg: #f3e8ff;

            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --shadow-md: 0 1px 3px rgba(15, 23, 42, 0.06);
            --transition-smooth: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Vazir', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
            font-size: 16px;
            background-color: var(--bg-main);
            color: var(--text-body);
            margin: 0;
            padding: 2rem 1.5rem;
            direction: rtl;
            min-height: 100vh;
            line-height: 1.7;
        }

        .container { 
            width: 100%; 
            max-width: 1650px; 
            margin: 0 auto; 
        }

        header { 
            text-align: center; 
            margin-bottom: 2.5rem; 
        }

        h1 { 
            font-size: clamp(1.6rem, 3.5vw, 2.4rem); 
            font-weight: 800; 
            color: var(--text-heading); 
            margin: 0 0 0.75rem 0; 
        }

        .subtitle { 
            color: var(--text-muted); 
            font-size: clamp(0.9rem, 1.8vw, 1.05rem); 
            margin: 0; 
            font-weight: 500;
        }

        h2 { 
            font-size: clamp(1.15rem, 2.2vw, 1.45rem); 
            font-weight: 800; 
            color: var(--text-heading); 
            margin: 2rem 0 1.25rem 0; 
            display: flex; 
            align-items: center; 
            gap: 0.75rem; 
        }

        h2::before { 
            content: ''; 
            width: 6px; 
            height: 1.5rem; 
            background-color: var(--primary); 
            border-radius: var(--radius-sm); 
            flex-shrink: 0;
        }

        .card { 
            background-color: var(--bg-surface); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-lg); 
            padding: 2rem; 
            margin-bottom: 2rem; 
            box-shadow: var(--shadow-md); 
            position: relative;
        }

        .seo-tag { 
            display: inline-block; 
            font-size: 0.75rem; 
            font-weight: 800; 
            padding: 0.2rem 0.5rem; 
            border-radius: var(--radius-sm); 
            margin-right: 0.35rem; 
            font-family: monospace; 
            vertical-align: middle; 
        }

        .seo-tag.t { background-color: var(--bg-neutral-light); color: var(--accent-sky); border: 1px solid var(--border-subtle); }
        .seo-tag.h1 { background-color: var(--bg-neutral-light); color: var(--accent-emerald); border: 1px solid var(--border-subtle); }
        .seo-tag.md { background-color: var(--bg-neutral-light); color: var(--accent-purple); border: 1px solid var(--border-subtle); }

        /* Hierarchical heading outline (H1-H6 nested inside one matrix cell) */
        .heading-outline-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            text-align: right;
        }

        .heading-outline-item {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .heading-outline-text {
            color: var(--text-body);
        }

        .heading-level-tag {
            flex-shrink: 0;
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 800;
            font-family: monospace;
            padding: 0.1rem 0.4rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-neutral-light);
        }

        .heading-level-tag.h1 { color: var(--accent-emerald); }
        .heading-level-tag.h2 { color: var(--accent-sky); }
        .heading-level-tag.h3 { color: var(--accent-purple); }
        .heading-level-tag.h4 { color: var(--accent-amber); }
        .heading-level-tag.h5 { color: var(--accent-rose); }
        .heading-level-tag.h6 { color: var(--text-muted); }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 6px;
            margin: 2px;
            letter-spacing: 0.2px;
        }

        .badge-target { background-color: var(--bg-neutral-light); color: #6b21a8; border: 1px solid var(--border-subtle); }
        .badge-kr { background-color: var(--bg-neutral-light); color: #1e40af; border: 1px solid var(--border-subtle); }
        .badge-gsc { background-color: var(--bg-neutral-light); color: #5b21b6; border: 1px solid var(--border-subtle); }
        .badge-c1, .badge-c2, .badge-c3, .badge-c4, .badge-c5 { background-color: var(--bg-neutral-light); color: #9d174d; border: 1px solid var(--border-subtle); }
        .badge-pasf { background-color: var(--bg-neutral-light); color: #115e59; border: 1px solid var(--border-subtle); }
        .badge-paaf { background-color: var(--bg-neutral-light); color: #9a3412; border: 1px solid var(--border-subtle); }

        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 1.5rem; 
            margin-bottom: 2rem; 
        }

        .dashboard-grid > .control-group { min-width: 0; }
        .target-control { grid-column: 1 / -1; }

        .control-group { 
            display: flex; 
            flex-direction: column; 
            gap: 0.6rem; 
        }

        label { 
            font-size: 0.92rem; 
            font-weight: 700; 
            color: var(--text-heading); 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 0.4rem; 
            flex-wrap: wrap;
        }

        textarea, input[type="text"], input[type="file"] { 
            width: 100%; 
            box-sizing: border-box; 
        }

        textarea { 
            padding: 0.85rem 1.1rem; 
            background-color: #ffffff; 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-md); 
            color: var(--text-heading); 
            font-size: 0.92rem; 
            direction: ltr; 
            font-family: monospace; 
            height: 120px; 
            resize: vertical; 
            transition: var(--transition-smooth);
        }

        input[type="text"] { 
            padding: 0.75rem 1rem; 
            background-color: #ffffff; 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-md); 
            color: var(--text-heading); 
            font-size: 0.92rem; 
            transition: var(--transition-smooth);
        }

        textarea:focus, input[type="text"]:focus { 
            background-color: #ffffff; 
            border-color: var(--border-active); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); 
        }

        input[type="file"] { 
            padding: 0.75rem; 
            background-color: #ffffff; 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-md); 
            font-size: 0.88rem; 
            cursor: pointer; 
            color: var(--text-body); 
        }

        .section-badge { 
            background: var(--bg-neutral-light); 
            border: 1px solid var(--border-subtle);
            padding: 0.25rem 0.65rem; 
            border-radius: var(--radius-sm); 
            font-size: 0.75rem; 
            font-weight: 800; 
            color: var(--accent-sky); 
        }

        .action-buttons { 
            display: flex; 
            gap: 1rem; 
            margin-top: 1.5rem; 
            flex-wrap: wrap;
        }

        button { 
            flex: 1; 
            min-width: 240px;
            background: var(--primary); 
            color: #ffffff; 
            padding: 1rem 2rem; 
            border: none; 
            border-radius: var(--radius-md); 
            font-size: 1.05rem; 
            cursor: pointer; 
            font-weight: 700; 
            transition: var(--transition-smooth); 
            touch-action: manipulation;
        }

        button:hover { 
            background: var(--primary-hover); 
        }

        button:disabled { 
            background: #e2e8f0; 
            color: #94a3b8; 
            cursor: not-allowed; 
            transform: none; 
            box-shadow: none; 
            opacity: 0.7;
        }

        .gap-search-container {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }

        .gap-search-input {
            flex: 1;
            border: 1px solid var(--border-subtle) !important;
            padding: 0.6rem 0.85rem !important;
            font-size: 0.88rem !important;
            border-radius: var(--radius-sm) !important;
        }

        .status-bar { 
            margin-top: 1.5rem; 
            padding: 1rem; 
            border-radius: var(--radius-md); 
            background-color: var(--accent-amber-bg); 
            border: 1px solid #fde68a; 
            color: #92400e; 
            text-align: center; 
            font-weight: 700; 
            display: none; 
        }

        .status-bar.error { 
            background-color: var(--accent-rose-bg); 
            border-color: #fca5a5; 
            color: #991b1b; 
        }

        .status-bar.success { 
            background-color: var(--accent-emerald-bg); 
            border-color: #a7f3d0; 
            color: #065f46; 
        }

        .mega-table-wrapper { 
            width: 100%; 
            overflow-x: auto; 
            margin: 1.5rem 0; 
            background-color: var(--bg-surface); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-md); 
            -webkit-overflow-scrolling: touch;
        }

        .mega-table-wrapper table { 
            width: 100%; 
            min-width: 900px; 
            border-collapse: separate; 
            border-spacing: 0; 
            font-size: 0.9rem; 
            table-layout: fixed; 
        }

        .mega-table-wrapper th, .mega-table-wrapper td { 
            padding: 1.1rem 1.2rem; 
            border-bottom: 1px solid var(--border-subtle); 
            border-left: 1px solid var(--border-subtle); 
            vertical-align: top; 
            text-align: right; 
            word-wrap: break-word; 
            color: var(--text-body); 
        }

        .mega-table-wrapper td.feature-label { 
            background-color: #f8fafc !important; 
            color: var(--text-heading); 
            font-weight: 800; 
            text-align: center; 
            vertical-align: middle; 
            width: 190px; 
            position: sticky; 
            right: 0; 
            z-index: 10; 
            border-left: 2px solid var(--border-subtle); 
        }

        .mega-table-wrapper th.feature-corner { 
            background-color: #f1f5f9 !important; 
            color: var(--text-heading); 
            font-weight: 900; 
            width: 190px; 
            position: sticky; 
            right: 0; 
            top: 0; 
            z-index: 12; 
            text-align: center; 
            border-left: 2px solid var(--border-subtle); 
        }

        .mega-table-wrapper th.source-column-header { 
            background-color: #f8fafc !important; 
            color: var(--text-heading); 
            font-weight: 800; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 8; 
        }

        .phrase-scroll-box {
            max-height: 260px;
            overflow-y: auto;
            padding-inline-end: 0.3rem;
        }

        .phrase-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background-color: var(--bg-neutral-light); 
            border: 1px solid var(--border-subtle); 
            padding: 0.5rem 0.8rem; 
            border-radius: var(--radius-sm); 
            margin-bottom: 0.5rem; 
            font-size: 0.88rem; 
            gap: 0.5rem;
        }

        .phrase-wrapper { 
            display: flex; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 0.35rem; 
        }

        .phrase-text { 
            color: var(--text-heading); 
            font-weight: 700; 
        }

        .count-badge { 
            font-size: 0.78rem; 
            font-weight: 700; 
            color: var(--accent-emerald); 
            background-color: var(--bg-neutral-light); 
            border: 1px solid var(--border-subtle);
            padding: 0.2rem 0.5rem; 
            border-radius: var(--radius-sm); 
            white-space: nowrap;
        }
        
        /* Read-More Component */
        .read-more-container { 
            position: relative; 
            width: 100%;
            background-color: transparent;
        }

        .read-more-content {
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .read-more-content.collapsed { 
            max-height: 140px !important; 
            overflow: hidden !important; 
            mask-image: linear-gradient(to bottom, #000 40%, transparent 100%) !important; 
            -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 100%) !important; 
        }

        .read-more-content:not(.collapsed) {
            max-height: none !important;
            overflow: visible !important;
            mask-image: none !important;
            -webkit-mask-image: none !important;
        }

        .read-more-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.45rem 1.25rem; 
            margin-top: 0.75rem; 
            background: var(--primary); 
            color: #ffffff; 
            border: none; 
            border-radius: var(--radius-sm); 
            font-size: 0.85rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: var(--transition-smooth); 
            touch-action: manipulation;
            width: auto;
        }

        .read-more-btn:hover { 
            background: var(--primary-hover); 
        }

        /* SCROLLABLE BOX UTILITY STYLES */
        .scrollable-table-box {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
        }

        .scrollable-kw-list {
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 0.5rem;
            background: var(--bg-surface);
        }

        .scrollable-box-5items {
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 0.75rem;
            background: var(--bg-surface);
        }

        .anchor-preview-box { 
            background-color: #f8fafc; 
            border: 1px solid var(--border-subtle); 
            padding: 0.85rem; 
            border-radius: var(--radius-md); 
            font-size: 0.88rem; 
            color: var(--accent-sky); 
            line-height: 1.9; 
        }

        .anchor-preview-line { 
            display: flex; 
            align-items: center; 
            gap: 0.4rem; 
            padding: 0.2rem 0; 
            border-bottom: 1px dashed var(--border-subtle); 
        }

        .anchor-preview-line:last-child {
            border-bottom: none;
        }
        
        .filter-notice { 
            font-size: 0.9rem; 
            color: var(--text-body); 
            background-color: var(--bg-neutral-light); 
            border: 1px solid var(--border-subtle); 
            border-right: 3px solid var(--accent-emerald);
            padding: 0.85rem 1.25rem; 
            border-radius: var(--radius-md); 
            margin-bottom: 1.5rem; 
            display: flex; 
            align-items: center; 
            gap: 0.6rem; 
        }

        .table-responsive { 
            width: 100%; 
            margin: 1rem 0; 
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-responsive table { 
            width: 100%; 
            border-collapse: collapse; 
        }

        .table-responsive th { 
            background-color: var(--bg-neutral-light); 
            color: var(--text-heading); 
            padding: 1rem; 
            border-bottom: 2px solid var(--border-subtle); 
            text-align: right; 
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .table-responsive td { 
            padding: 1rem; 
            border-bottom: 1px solid var(--border-subtle); 
            text-align: right; 
            color: var(--text-body); 
        }

        ul { 
            margin: 0; 
            padding-right: 1.2rem; 
        }

        li { 
            margin-bottom: 0.35rem; 
        }

        .ai-badge { 
            background: var(--primary); 
            color: #ffffff; 
            padding: 0.25rem 0.65rem; 
            border-radius: var(--radius-sm); 
            font-size: 0.78rem; 
            font-weight: 700; 
            display: inline-flex; 
            align-items: center; 
            gap: 0.3rem; 
        }
        
        .target-kw-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 0.75rem; 
        }
        
        .suggested-kw-card { 
            background: var(--bg-surface); 
            border: 1px solid var(--border-subtle); 
            border-top: 3px solid var(--accent-emerald);
            border-radius: var(--radius-md); 
            padding: 1.25rem; 
            margin-top: 1.5rem; 
        }

        .gap-kw-card { 
            background: var(--bg-surface); 
            border: 1px solid var(--border-subtle); 
            border-top: 3px solid var(--accent-amber);
            border-radius: var(--radius-md); 
            padding: 1.25rem; 
            margin-top: 1.5rem; 
        }

        .suggested-kw-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 0.85rem; 
            margin-top: 1rem; 
        }

        .suggested-kw-item { 
            background: var(--bg-neutral-light); 
            border: 1px solid var(--border-subtle); 
            padding: 0.75rem 1rem; 
            border-radius: var(--radius-sm); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 0.9rem; 
            font-weight: 700; 
            color: var(--text-heading); 
        }

        .suggested-score { 
            background: var(--bg-surface); 
            color: var(--accent-sky); 
            border: 1px solid var(--border-subtle);
            font-size: 0.75rem; 
            padding: 0.2rem 0.5rem; 
            border-radius: var(--radius-sm); 
            font-family: monospace; 
            font-weight: 700;
        }

        .gap-score { 
            background: var(--bg-surface); 
            color: var(--accent-amber); 
            border: 1px solid var(--border-subtle);
            font-size: 0.75rem; 
            padding: 0.2rem 0.5rem; 
            border-radius: var(--radius-sm); 
            font-family: monospace; 
            font-weight: 700;
        }

        .comp-gap-score { 
            background: var(--bg-surface); 
            color: var(--accent-amber); 
            border: 1px solid var(--border-subtle);
            font-size: 0.75rem; 
            padding: 0.15rem 0.45rem; 
            border-radius: var(--radius-sm); 
            font-family: monospace; 
            margin-right: 0.4rem; 
            font-weight: 700;
        }

        @media (max-width: 991px) {
            body { padding: 1.25rem 0.75rem; }
            .card { padding: 1.25rem; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            button { width: 100%; min-width: 0; }
            .suggested-kw-list { grid-template-columns: 1fr; }
            .card > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            h2 { font-size: 1.1rem; }
            .card { padding: 1rem; border-radius: var(--radius-md); }
            textarea { height: 100px; }
            .table-responsive th, .table-responsive td { padding: 0.75rem 0.5rem; font-size: 0.82rem; }
        }

        button:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 3px solid #818cf8;
            outline-offset: 2px;
        }

        /* =====================================================
           UX/UI REFINEMENT LAYER (visual only – no logic changes)
           ===================================================== */
        html { scroll-behavior: smooth; scroll-padding-top: 76px; }
        body { padding: 0 1.25rem 4rem; line-height: 1.75; -webkit-font-smoothing: antialiased; }
        .container { max-width: 1400px; margin-inline: auto; }

        /* Hero header */
        header { margin: 0 -1.25rem 1.5rem; padding: 2rem 1.5rem 3.25rem; text-align: center;
            background: linear-gradient(135deg, #312e81 0%, #4f46e5 55%, #6366f1 100%); border-radius: 0 0 28px 28px; }
        header h1 { color: #fff !important; margin: 0; font-size: clamp(1.25rem, 2.6vw, 1.9rem); font-weight: 800; letter-spacing: -0.2px; }

        /* Sticky jump navigation */
        #ux-nav { position: sticky; top: 10px; z-index: 50; display: none; gap: .4rem; overflow-x: auto; padding: .45rem;
            margin: -2.1rem auto 1.5rem; max-width: 100%; background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
            border: 1px solid var(--border-subtle); border-radius: 999px; box-shadow: 0 6px 24px rgba(30,27,75,.12); scrollbar-width: none; }
        #ux-nav.show { display: flex; }
        #ux-nav::-webkit-scrollbar { display: none; }
        #ux-nav a { flex: 0 0 auto; padding: .4rem .95rem; border-radius: 999px; font-size: .82rem; font-weight: 700;
            color: var(--text-body); text-decoration: none; white-space: nowrap; transition: var(--transition-smooth); }
        #ux-nav a:hover { background: var(--primary-light); color: var(--primary-hover); }
        #ux-nav a.active { background: var(--primary); color: #fff; }

        /* Cards */
        .card { border-radius: 18px; border: 1px solid var(--border-subtle); box-shadow: 0 2px 10px rgba(15,23,42,.05);
            padding: 1.5rem 1.6rem; transition: box-shadow .2s ease; }
        .card:hover { box-shadow: 0 8px 24px rgba(15,23,42,.08); }
        .card > h2 { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; font-size: 1.2rem; font-weight: 800;
            padding-bottom: .9rem; margin-bottom: 1.1rem; border-bottom: 2px solid var(--bg-neutral-light); }
        .card h3 { font-weight: 700; }

        /* Input form */
        .dashboard-grid { gap: 1.1rem; }
        .control-group { background: var(--bg-neutral-light); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 1rem; transition: var(--transition-smooth); }
        .control-group:focus-within { border-color: var(--border-active); background: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,.12); }
        .control-group label { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; font-weight: 700; color: var(--text-heading); margin-bottom: .6rem; }
        .section-badge { font-weight: 600; }
        textarea, input[type="text"], input[type="file"] { border-radius: 10px; font-family: inherit; transition: var(--transition-smooth); }
        textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--border-active); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
        :focus-visible { outline: 3px solid rgba(99,102,241,.45); outline-offset: 2px; }

        /* Primary action */
        .action-buttons { position: sticky; bottom: 0; z-index: 20; padding: .9rem 0 .2rem; margin-top: 1rem;
            background: linear-gradient(to top, #fff 65%, rgba(255,255,255,0)); }
        #start-btn { border-radius: 12px; font-weight: 800; font-size: 1.02rem; padding: .85rem 2rem;

        #start-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(79,70,229,.42); }
        #start-btn:active { transform: translateY(0); }
        .status-bar { border-radius: 10px; }

        /* Tables */
        .scrollable-table-box, .table-responsive { border: 1px solid var(--border-subtle); border-radius: 12px; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .88rem; }
        thead th { position: sticky; top: 0; z-index: 2; background: #eef2ff; color: var(--text-heading); font-weight: 800;

        tbody td { padding: .55rem .8rem; border-bottom: 1px solid var(--bg-neutral-light); }
        tbody tr:nth-child(even) { background: rgba(248,250,252,.9); }
        tbody tr:hover { background: var(--primary-light) !important; }
        td:not(:first-child), th:not(:first-child) { font-variant-numeric: tabular-nums; }

        /* Keyword list rows & lists */
        .suggested-kw-item { border-radius: 12px; border: 1px solid var(--border-subtle); transition: var(--transition-smooth); }
        .suggested-kw-item:hover { border-color: var(--border-active); box-shadow: 0 4px 14px rgba(99,102,241,.12); transform: translateY(-1px); }
        .badge { border-radius: 6px; font-weight: 700; letter-spacing: .2px; }
        li { line-height: 1.8; }

        /* Read-more & clear buttons */
        .read-more-btn { border-radius: 999px; font-weight: 700; padding: .4rem 1.1rem; transition: var(--transition-smooth); cursor: pointer; }
        .read-more-btn:hover { background: var(--primary-light); color: var(--primary-hover); }

        /* Back to top */
        #ux-top { position: fixed; bottom: 22px; left: 22px; z-index: 60; width: 46px; height: 46px; border: none; border-radius: 50%;
            background: var(--primary); color: #fff; font-size: 1.2rem; cursor: pointer; box-shadow: 0 6px 18px rgba(79,70,229,.4);
            opacity: 0; pointer-events: none; transform: translateY(10px); transition: var(--transition-smooth); }
        #ux-top.show { opacity: 1; pointer-events: auto; transform: none; }
        #ux-top:hover { background: var(--primary-hover); }

        /* Result sections fade in */
        #gsc-section > *, #suggested-keywords-section > *, #gap-analysis-section > *, #url-matrix-section > *,
        #phrase-results-section > *, #intent-section > *, #detailed-gaps-section > * { animation: uxFade .35s ease both; }
        @keyframes uxFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        @media (max-width: 900px) {
            .card { padding: 1.1rem; }
            header { padding: 1.5rem 1rem 3rem; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
        @media print { header, #ux-nav, #ux-top, .action-buttons { display: none !important; } .card { box-shadow: none; break-inside: avoid; } }

        /* ---------- UX pass 2 (visual only) ---------- */
        /* Back-to-top: was inheriting the global button width */
        #ux-top { flex: none; min-width: 0; width: 46px; height: 46px; padding: 0; line-height: 1; display: grid; place-items: center; }

        /* Sections 2 & 3: keyword cards */
        .suggested-kw-card, .gap-kw-card { margin-top: .5rem; padding: 1.1rem; box-shadow: none; }
        .scrollable-kw-list { max-height: 520px; padding: .75rem; scrollbar-width: thin; scrollbar-color: #c7d2fe transparent; }
        .suggested-kw-list { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: .8rem; }
        .suggested-kw-item { position: relative; gap: .55rem !important; padding: .85rem 1rem; background: #fff; border-right: 3px solid var(--accent-emerald); }
        .gap-kw-card .suggested-kw-item { border-right-color: var(--accent-amber); }
        .suggested-kw-item > div:first-child { flex-wrap: wrap; align-items: flex-start; gap: .5rem !important; }
        .suggested-kw-item > div:first-child > span:first-child { flex: 1 1 60%; min-width: 0; line-height: 1.9; font-weight: 700; }
        .suggested-kw-item strong { display: inline-block; min-width: 2.1rem; text-align: center; margin-inline-end: .5rem; padding: .05rem .4rem;

        .suggested-kw-item > div:first-child .badge { margin-inline-start: .4rem; }
        .suggested-score, .gap-score, .comp-gap-score { flex: 0 0 auto; white-space: nowrap; font-family: inherit; font-size: .74rem; font-weight: 700;
            padding: .15rem .6rem; border-radius: 999px; background: var(--bg-neutral-light); }
        .suggested-kw-item > div:last-child { display: flex; flex-wrap: wrap; gap: .3rem; width: 100%; padding-top: .55rem; border-top: 1px dashed var(--border-subtle); }

        /* Section 5: per-source phrase matrix */
        .table-responsive:has(.phrase-scroll-box) { overflow-x: auto; }
        .table-responsive:has(.phrase-scroll-box) table { min-width: 1180px; table-layout: fixed; }
        .table-responsive:has(.phrase-scroll-box) th:first-child, .table-responsive:has(.phrase-scroll-box) td:first-child {
            position: sticky; right: 0; z-index: 3; background: #fff; width: 150px; box-shadow: -6px 0 10px -8px rgba(15,23,42,.25); }
        .table-responsive:has(.phrase-scroll-box) thead th:first-child { z-index: 4; background: #eef2ff; }
        .table-responsive:has(.phrase-scroll-box) td { padding: .7rem; vertical-align: top; }

        .phrase-item { flex-direction: column; align-items: stretch; gap: .4rem; padding: .55rem .7rem; background: #fff;
            border-right: 3px solid var(--primary); transition: var(--transition-smooth); }
        .phrase-item:hover { border-color: var(--border-active); box-shadow: 0 3px 10px rgba(99,102,241,.12); }
        .phrase-wrapper { flex-direction: column; align-items: flex-start; gap: .35rem; }
        .phrase-wrapper .phrase-text { line-height: 1.7; word-break: normal; overflow-wrap: anywhere; }
        .phrase-wrapper .seo-tag { margin: 0 .3rem 0 0; display: inline-block; }
        .phrase-item .count-badge { align-self: flex-start; white-space: normal; font-weight: 700; padding: .15rem .55rem; border-radius: 999px; background: var(--accent-emerald-bg); border-color: transparent; }

        /* ---------- UX pass 3: compact phrase cards (T / H1 / MD in one row) ---------- */
        .phrase-item { flex-direction: row; flex-wrap: wrap; align-items: center; column-gap: .35rem; row-gap: .3rem; padding: .5rem .65rem; }
        .phrase-item .phrase-wrapper { display: contents; }
        .phrase-item .phrase-text { flex: 1 1 100%; line-height: 1.6; }
        .phrase-item .seo-tag { flex: 0 0 auto; margin: 0; padding: .08rem .42rem; font-size: .68rem; line-height: 1.5; }
        .phrase-item .count-badge { margin-inline-start: auto; align-self: center; white-space: nowrap; font-size: .74rem; padding: .1rem .5rem; }

        /* ---------- UX pass 4: neutral density pill + tighter card padding (phrase matrix only) ---------- */
        .phrase-item .count-badge { background: transparent; border: 1px solid var(--border-subtle); color: var(--accent-emerald); padding: .05rem .45rem; }
        .phrase-item { padding: .4rem .55rem; margin-bottom: .4rem; row-gap: .2rem; }
        .phrase-item .phrase-text { line-height: 1.5; }
        .phrase-scroll-box { padding-inline: 0 .3rem; }
        .table-responsive:has(.phrase-scroll-box) td { padding: .55rem .5rem; }

        /* ---------- UX pass 5: T / H1 / MD tags joined with no gap ---------- */
        .phrase-item { column-gap: 0; }
        .phrase-item .seo-tag { margin: 0 !important; border-radius: 0; margin-inline-end: -1px !important; }
        .phrase-item .phrase-text { margin-bottom: 0; }
        .phrase-item .count-badge { margin-inline-start: auto; }

        /* ---------- UX pass 6: zebra rows for the phrase matrix (section 5) ---------- */
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(odd),
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(odd) td { background: #ffffff !important; }
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(even),
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(even) td { background: #e6ebf5 !important; }
        .table-responsive:has(.phrase-scroll-box) tbody tr:hover,
        .table-responsive:has(.phrase-scroll-box) tbody tr:hover td { background: #dbe4ff !important; }
        .table-responsive:has(.phrase-scroll-box) tbody td { border-bottom: 1px solid #cbd5e1; }

        /* ---------- UX pass 7: calm, low-noise phrase matrix (section 5) ---------- */
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(odd),
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(odd) td { background: #ffffff !important; }
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(even),
        .table-responsive:has(.phrase-scroll-box) tbody tr:nth-child(even) td { background: #f5f7fb !important; }
        .table-responsive:has(.phrase-scroll-box) tbody tr:hover,
        .table-responsive:has(.phrase-scroll-box) tbody tr:hover td { background: #f5f7fb !important; }
        .table-responsive:has(.phrase-scroll-box) tbody td { border-bottom: 1px solid var(--border-subtle); border-left: 1px solid #eef1f6; padding: .5rem .7rem; }
        .table-responsive:has(.phrase-scroll-box) tbody td:first-child { font-size: .85rem; line-height: 1.6; }
        .table-responsive:has(.phrase-scroll-box) thead th { font-size: .78rem; text-align: right; }

        /* Scroll area: shows ~5 phrases, soft fade hints there is more */
        .phrase-scroll-box { max-height: 285px; padding-inline: 0 .4rem; scrollbar-width: thin; scrollbar-color: #d5dbe8 transparent;
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent); }

        /* Phrase rows: flat list instead of boxed cards */
        .phrase-item { background: transparent !important; border: 0; border-bottom: 1px solid #e9edf5; border-radius: 0; box-shadow: none;
            margin: 0; padding: .45rem .25rem; row-gap: .15rem; }
        .phrase-item:last-child { border-bottom: 0; }
        .phrase-item:hover { background: rgba(99,102,241,.06) !important; box-shadow: none; border-color: #e9edf5; }
        .phrase-item .phrase-text { font-size: .84rem; font-weight: 600; line-height: 1.55; color: var(--text-heading); unicode-bidi: plaintext; text-align: start; }
        /* the first phrase in each cell is the strongest: give it a little emphasis */
        .phrase-scroll-box > .phrase-item:first-child .phrase-text { font-weight: 800; }

        /* Tags: tiny, quiet chips */
        .phrase-item .seo-tag { font-size: .6rem; font-weight: 700; padding: .02rem .32rem; line-height: 1.6; background: #fff; border: 1px solid #e2e8f0; opacity: .85; }

        /* Numbers: muted secondary info, not a colored block */
        .phrase-item .count-badge { background: transparent; border: 0; padding: 0; color: var(--text-muted); font-size: .7rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>داشبورد تحلیل پیشرفته سئو برای تحلیل کلمات کلیدی</h1>
    </header>
    <nav id="ux-nav" aria-label="پیمایش سریع بین بخش‌ها"></nav>
    
    <div class="card">
       

        <div class="dashboard-grid">
            <div class="control-group">
                <label>۱. لیست تحقیق کلمات کلیدی (Keyword Research)<span class="section-badge">متن خام</span></label>
                <textarea aria-label="لیست تحقیق کلمات کلیدی" id="kw-input" placeholder="هر کلمه یا عبارت را در یک خط وارد کنید (پشتیبانی تا ده‌ها هزار کلمه)..."></textarea>
            </div>

            <div class="control-group">
                <label>۲. گزارش گوگل سرچ کنسول (GSC CSV File)<span class="section-badge">آپلود فایل CSV (اختیاری)</span></label>
                <input aria-label="فایل CSV گوگل سرچ کنسول" type="file" id="gsc-file-input" accept=".csv">
            </div>

            <div class="control-group">
                <label>۳. صفحه وب خودی (Our Webpage / Text Body)<span class="section-badge" style="background:var(--accent-emerald-bg); color:var(--accent-emerald);">اصلی</span></label>
                <textarea id="our-html-input" placeholder="کد HTML یا متن بدنه صفحه خودی را اینجا وارد کنید..."></textarea>
            </div>

            <div class="control-group">
                <label>۴.۱. رقیب اول SERP</label>
                <textarea class="comp-html-input" placeholder="کد سورس صفحات رقیب را وارد کنید (ctrl+U سپس ctrl+A و بعد کپی و در این قسمت پیست شود)"></textarea>
            </div>
            <div class="control-group">
                <label>۴.۲. رقیب دوم SERP</label>
                <textarea class="comp-html-input" placeholder="کد سورس صفحات رقیب را وارد کنید (ctrl+U سپس ctrl+A و بعد کپی و در این قسمت پیست شود)"></textarea>
            </div>
            <div class="control-group">
                <label>۴.۳. رقیب سوم SERP</label>
                <textarea class="comp-html-input" placeholder="کد سورس صفحات رقیب را وارد کنید (ctrl+U سپس ctrl+A و بعد کپی و در این قسمت پیست شود)"></textarea>
            </div>
            <div class="control-group">
                <label>۴.۴. رقیب چهارم SERP</label>
                <textarea class="comp-html-input" placeholder="کد سورس صفحات رقیب را وارد کنید (ctrl+U سپس ctrl+A و بعد کپی و در این قسمت پیست شود)"></textarea>
            </div>
            <div class="control-group">
                <label>۴.۵. رقیب پنجم SERP</label>
                <textarea class="comp-html-input" placeholder="کد سورس صفحات رقیب را وارد کنید (ctrl+U سپس ctrl+A و بعد کپی و در این قسمت پیست شود)"></textarea>
            </div>

            <div class="control-group">
                <label>۵. جستجوهای مرتبط (PASF)<span class="section-badge">محتوا</span></label>
                <textarea id="pasf-input" placeholder="عبارات PASF، در هر خط 1 عبارت وارد کنید"></textarea>
            </div>
            <div class="control-group">
                <label>۶. سوالات پرتکرار کاربران (PAAF)<span class="section-badge">FAQ</span></label>
                <textarea id="paaf-input" placeholder="سوالات PAA، در هر خط 1 سوال وارد کنید"></textarea>
            </div>

            <div class="control-group target-control" style="background: var(--bg-neutral-light); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
                <label style="color: var(--primary); font-size: 1rem; margin-bottom: 0.5rem;">
                    ۷. کوئری‌های استراتژیک هدف (۱ اصلی Seed + ۳ لانگ‌تیل Long-tail)
                    <span class="section-badge" style="background:#ffffff; color:var(--primary);">مبنای مقایسه</span>
                </label>
                <div class="target-kw-grid">
                    <input type="text" id="seed-target-kw" placeholder="🌱 ۱. کلمه کلیدی اصلی (Seed Query) - مثلا: دکتری روانشناسی تربیتی">
                    <input type="text" id="longtail-target-1" placeholder="🌿 ۲. کلمه لانگ‌تیل اول - مثلا: منابع آزمون دکتری روانشناسی تربیتی">
                    <input type="text" id="longtail-target-2" placeholder="🌿 ۳. کلمه لانگ‌تیل دوم - مثلا: گرایش‌های دکتری روانشناسی تربیتی">
                    <input type="text" id="longtail-target-3" placeholder="🌿 ۴. کلمه لانگ‌تیل سوم - مثلا: مشاوره کنکور دکتری روانشناسی تربیتی">
                </div>
            </div>

        <div class="action-buttons">
            <button type="button" id="start-btn" onclick="triggerUnifiedExtractionWorkflow()">شروع تحلیل پیشرفته ماتریس سئو</button>
        </div>
        <div id="status-output" class="status-bar"></div>
    </div>

    <!-- ORDERED SECTIONS -->
    <div id="gsc-section"></div>
    <div id="suggested-keywords-section"></div>
    <div id="gap-analysis-section"></div>

    <div id="detailed-gaps-section"></div>

<script>
let parsedSourcesMemory = [];
let globalPerSourcePhrases = {};
let parsedGscData = [];
let targetKeywordsList = [];
let pasfList = [];
let paafList = [];
let ourWebpageData = null;
let competitorSources = [];

let targetKeywordsNormalizedSet = new Set();
let targetKeywordsNormalizedList = [];
let gscQueriesMap = new Map();
let pasfNormalizedList = [];
let paafNormalizedList = [];
let pasfNormalizedSet = new Set();
let paafNormalizedSet = new Set();

let rawCalculatedOurGaps = [];
let rawCalculatedCompGapsList = []; // [{ containerId, countId, wrapperId, gaps: [...] }]

// ---------------------------------------------------------------
// عبارات حذف‌شده از پیکره‌ی کلمات و محاسبه‌ی چگالی (بدون تاثیر بر Title / H1 / Meta)
// جداکننده‌ی " | " باعث می‌شود بعد از حذف، عبارت‌های اطراف به هم نچسبند.
// ---------------------------------------------------------------
const CORPUS_EXCLUDED_PHRASES = [
    "افزودن به سبد خرید",
    "سبد خرید",
    "تومان",
    "هزارتومان",
    "هزار تومان",
    "به سبد خرید",
    "نام کاربری"
];
const CORPUS_EXCLUDED_REGEX = (function () {
    const fa = "\\u0600-\\u06FF\\u200c";
    const parts = CORPUS_EXCLUDED_PHRASES
        .slice()
        .sort((a, b) => b.length - a.length)
        .map(ph => ph.split(/\s+/).join("[\\s\\u200c]+").replace(/ی/g, "[یيی]").replace(/ک/g, "[کك]"));
    return new RegExp("(?<![" + fa + "])(?:" + parts.join("|") + ")(?![" + fa + "])", "g");
})();
function stripCorpusExcludedPhrases(text = "") {
    return String(text).replace(CORPUS_EXCLUDED_REGEX, " | ");
}

function normalizeText(value = "") {
    return String(value)
        .normalize("NFKC")
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
        .replace(/\u0640/g, "")
        .replace(/ي/g, "ی")
        .replace(/ك/g, "ک")
        // نیم‌فاصله (ZWNJ) در فارسی نقش معنایی دارد و نباید مثل یک فاصلهٔ
        // معمولی در نظر گرفته شود — «می‌شود» (با نیم‌فاصله) با «می شود»
        // (با فاصلهٔ واقعی) یکی نیستند و نباید هم‌ارز شمرده شوند. بنابراین
        // دیگر نیم‌فاصله را به space تبدیل نمی‌کنیم؛ فقط موارد نادرست/زائد
        // آن را پاک‌سازی می‌کنیم: نیم‌فاصله‌های پشت‌سرهم (خطای تایپی) را به
        // یک نیم‌فاصله فشرده می‌کنیم، و نیم‌فاصلهٔ بی‌معنای چسبیده به یک
        // فاصلهٔ واقعی یا در ابتدا/انتهای متن را حذف می‌کنیم.
        .replace(/\u200c{2,}/g, "\u200c")
        .replace(/\u200c(?=\s)|(?<=\s)\u200c/g, "")
        .replace(/^\u200c+|\u200c+$/g, "")
        .replace(/([\u0600-\u06FF])([A-Za-z0-9])/g, "$1 $2")
        .replace(/([A-Za-z0-9])([\u0600-\u06FF])/g, "$1 $2")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
}

function escapeHtml(value = "") {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// توکن‌سازی: هر زبانی (لاتین، ترکی، روسی، عربی و...) پشتیبانی می‌شود.
// - نیم‌فاصله (ZWNJ) فقط «داخل» کلمه‌ی فارسی/عربی حفظ می‌شود (می‌شود ≠ می شود)
// - هیچ توکن کوتاهی (مثل «و») حذف نمی‌شود
// - علائم نگارشی (، ؟ ؛ ٪ ...) جزو توکن نمی‌شوند
// - خط فارسی/عربی و سایر خطوط حتی در صورت چسبیدن، توکن جدا هستند («سئوSEO» → «سئو» و «seo»)
const _TOK_AR = "(?:(?=\\p{Script=Arabic})[\\p{L}\\p{N}\\p{M}]|[\\u0660-\\u0669])";
const _TOK_OT = "(?:(?![\\u0660-\\u0669])(?!\\p{Script=Arabic})[\\p{L}\\p{N}\\p{M}])";
const TOKEN_REGEX = new RegExp(_TOK_AR + "+(?:\\u200c" + _TOK_AR + "+)*|" + _TOK_OT + "+", "gu");

function tokenizeText(text = "") {
    return normalizeText(text).match(TOKEN_REGEX) || [];
}

// کلید یکتای یک عبارت برای «تطابق دقیق» بین لیست‌ها (KR / GSC / PASF / PAAF):
// توکن‌ها با یک فاصله به هم وصل می‌شوند و نیم‌فاصله‌ی داخل کلمات حفظ می‌ماند.
function keyOf(text = "") {
    return tokenizeText(text).join(" ");
}

function comparePresence(a, b) {
    return (b.presenceCount - a.presenceCount)
        || ((b.impressions || 0) - (a.impressions || 0))
        || a.phrase.localeCompare(b.phrase, "fa");
}

function yieldToMain() {
    return new Promise(resolve => setTimeout(resolve, 0));
}

function csvToRows(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let quoted = false;

    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"') {
            if (quoted && next === '"') {
                cell += '"';
                i++;
            } else {
                quoted = !quoted;
            }
        } else if ((ch === "," || ch === "\t" || ch === ";") && !quoted) {
            row.push(cell);
            cell = "";
        } else if ((ch === "\n" || ch === "\r") && !quoted) {
            if (ch === "\r" && next === "\n") i++;
            row.push(cell);
            if (row.some(v => String(v).trim() !== "")) rows.push(row);
            row = [];
            cell = "";
        } else {
            cell += ch;
        }
    }

    if (cell !== "" || row.length) {
        row.push(cell);
        if (row.some(v => String(v).trim() !== "")) rows.push(row);
    }
    return rows;
}

function parseNumber(value) {
    const normalized = String(value ?? "")
        .trim()
        .replace(/[%\s]/g, "")
        .replace(/,/g, "");
    const n = Number.parseFloat(normalized);
    return Number.isFinite(n) ? n : 0;
}

function findHeaderIndex(headers, names) {
    const normalizedHeaders = headers.map(normalizeText);
    return names.reduce((found, name) => {
        if (found !== -1) return found;
        const target = normalizeText(name);
        // اولویت اول: تطابق دقیق در کل ستون‌ها (مثلاً "CTR")، صرف‌نظر از موقعیت آن در فایل.
        const exactIdx = normalizedHeaders.findIndex(h => h === target);
        if (exactIdx !== -1) return exactIdx;
        // فقط اگر هیچ ستونی تطابق دقیق نداشت، به‌عنوان راه‌حل جایگزین سراغ تطابق جزئی می‌رویم
        // (مثلاً وقتی هدر واقعی چیزی مثل "نرخ کلیک (CTR)" است).
        return normalizedHeaders.findIndex(h => h.includes(target));
    }, -1);
}

function readFileAsText(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = e => reject(e);
        reader.readAsText(file, 'UTF-8');
    });
}

function toggleReadMore(btn) {
    const content = btn.previousElementSibling;
    const isCollapsed = content.classList.contains('collapsed');
    
    if (isCollapsed) {
        content.classList.remove('collapsed');
        btn.innerText = 'بستن 🔼';
        btn.setAttribute('aria-expanded', 'true');
    } else {
        content.classList.add('collapsed');
        btn.innerText = 'مشاهده بیشتر... 🔽';
        btn.setAttribute('aria-expanded', 'false');
    }
}

async function triggerUnifiedExtractionWorkflow() {
    const statusDiv = document.getElementById('status-output');
    statusDiv.style.display = "block";
    statusDiv.className = "status-bar";
    statusDiv.innerText = "⏳ در حال آماده‌سازی داده‌ها...";
    const startBtn = document.getElementById("start-btn");
    startBtn.disabled = true;

    await yieldToMain();

    try {
        const gscSection = document.getElementById('gsc-section');
        const suggestedKwSection = document.getElementById('suggested-keywords-section');
        const gapSection = document.getElementById('gap-analysis-section');
        const urlMatrixSection = document.getElementById('url-matrix-section');
        const phraseResultsSection = document.getElementById('phrase-results-section');
        const intentSection = document.getElementById('intent-section');
        const detailedGapsSection = document.getElementById('detailed-gaps-section');

        gscSection.innerHTML = "";
        suggestedKwSection.innerHTML = "";
        gapSection.innerHTML = "";
        urlMatrixSection.innerHTML = "";
        phraseResultsSection.innerHTML = "";
        intentSection.innerHTML = "";
        detailedGapsSection.innerHTML = "";

        parsedSourcesMemory = [];
        globalPerSourcePhrases = {};
        competitorSources = [];
        parsedGscData = [];
        cachedAllInputCandidates = [];

        statusDiv.innerText = "⏳ در حال ایندکس‌گذاری کلمات کلیدی...";
        await yieldToMain();
        
        const kwRaw = document.getElementById('kw-input').value.trim();
        targetKeywordsList = kwRaw ? [...new Set(kwRaw.split(/\r?\n/).map(k => k.trim()).filter(Boolean))] : [];
        
        targetKeywordsNormalizedSet = new Set();
        targetKeywordsNormalizedList = [];
        targetKeywordsList.forEach(k => {
            const norm = keyOf(k);
            if (norm) {
                targetKeywordsNormalizedSet.add(norm);
                targetKeywordsNormalizedList.push({ original: k, norm });
            }
        });

        const gscFileInput = document.getElementById('gsc-file-input');
        if (gscFileInput.files && gscFileInput.files[0]) {
            statusDiv.innerText = "⏳ در حال پردازش فایل سرچ کنسول...";
            await yieldToMain();
            try {
                const gscRaw = await readFileAsText(gscFileInput.files[0]);
                const rows = csvToRows(gscRaw.replace(/^\uFEFF/, ""));
                if (rows.length) {
                    const headers = rows[0];
                    const queryIndex = findHeaderIndex(headers, ["query", "کوئری", "عبارت جستجو"]);
                    const clicksIndex = findHeaderIndex(headers, ["clicks", "کلیک"]);
                    const impressionsIndex = findHeaderIndex(headers, ["impressions", "نمایش"]);
                    const ctrIndex = findHeaderIndex(headers, ["ctr", "نرخ کلیک"]);
                    const positionIndex = findHeaderIndex(headers, ["position", "موقعیت", "رتبه"]);

                    const hasHeader = queryIndex !== -1;
                    const startIndex = hasHeader ? 1 : 0;
                    const qIdx = hasHeader ? queryIndex : 0;
                    const cIdx = hasHeader ? clicksIndex : 1;
                    const iIdx = hasHeader ? impressionsIndex : 2;
                    const ctrIdx = hasHeader ? ctrIndex : 3;
                    const pIdx = hasHeader ? positionIndex : 4;

                    for (let i = startIndex; i < rows.length; i++) {
                        const parts = rows[i];
                        if (!parts.length || !String(parts[qIdx] ?? "").trim()) continue;
                        const qStr = String(parts[qIdx] ?? "").trim();
                        parsedGscData.push({
                            query: qStr,
                            normQuery: keyOf(qStr),
                            clicks: parseNumber(parts[cIdx]),
                            impressions: parseNumber(parts[iIdx]),
                            ctr: String(parts[ctrIdx] ?? "-").trim() || "-",
                            position: parseNumber(parts[pIdx])
                        });
                    }
                }
            } catch (err) {
                console.warn("خطا در خواندن فایل GSC:", err);
            }
        }

        gscQueriesMap.clear();
        parsedGscData.forEach(g => {
            if (!gscQueriesMap.has(g.normQuery)) gscQueriesMap.set(g.normQuery, []);
            gscQueriesMap.get(g.normQuery).push(g);
        });

        statusDiv.innerText = "⏳ در حال استخراج محتوای صفحه خودی...";
        await yieldToMain();
        const ourInput = document.getElementById('our-html-input').value.trim();
        if (ourInput) {
            ourWebpageData = parseOurPageContent(ourInput);
            parsedSourcesMemory.push(ourWebpageData);
            globalPerSourcePhrases["صفحه وب خودی (Our Page)"] = ourWebpageData.fullCombinedText;
        } else {
            ourWebpageData = null;
        }

        statusDiv.innerText = "⏳ در حال استخراج ساختار صفحات رقبا...";
        await yieldToMain();
        document.querySelectorAll('.comp-html-input').forEach((input, index) => {
            const htmlText = input.value.trim();
            if (htmlText) {
                const fallbackLabel = `رقیب شماره ${index + 1} SERP`;
                const compObj = parseHtmlDocument(fallbackLabel, htmlText);
                // اگر دامنه به‌صورت خودکار از کد HTML تشخیص داده شده باشد، همان را جایگزین عنوان عمومی می‌کنیم
                compObj.slot = index + 1;
                if (compObj.domain) {
                    compObj.label = `رقیب ${index + 1}: ${compObj.domain}`;
                }
                competitorSources.push(compObj);
                parsedSourcesMemory.push(compObj);
                globalPerSourcePhrases[compObj.label] = compObj.fullCombinedText;
            }
        });

        pasfList = document.getElementById('pasf-input').value.split(/\r?\n/).map(p => p.trim()).filter(Boolean);
        paafList = document.getElementById('paaf-input').value.split(/\r?\n/).map(p => p.trim()).filter(Boolean);
        
        pasfNormalizedList = pasfList.map(p => ({ original: p, norm: keyOf(p) }));
        paafNormalizedList = paafList.map(p => ({ original: p, norm: keyOf(p) }));
        pasfNormalizedSet = new Set(pasfNormalizedList.map(p => p.norm));
        paafNormalizedSet = new Set(paafNormalizedList.map(p => p.norm));

        if (parsedSourcesMemory.length === 0 && parsedGscData.length === 0 && targetKeywordsList.length === 0) {
            throw new Error("لطفا حداقل کلمات کلیدی، فایل GSC یا کدهای HTML صفحه خودی و رقبا را وارد کنید.");
        }

        statusDiv.innerText = "📊 در حال رندر گزارش سرچ کنسول...";
        await yieldToMain();
        renderGscInsights(gscSection);

        statusDiv.innerText = "📊 در حال ارزیابی عبارات ورودی (KR + GSC + PASF + PAAF)...";
        await yieldToMain();
        cachedAllInputCandidates = await buildAllInputCandidates(statusDiv);

        statusDiv.innerText = "📊 در حال محاسبه عبارات کلیدی پیشنهادی...";
        await yieldToMain();
        await renderTop100SuggestedKeywords(suggestedKwSection, statusDiv);

        statusDiv.innerText = "🎯 در حال تحلیل شکاف کلمات کلیدی (Gap Analysis)...";
        await yieldToMain();
        await renderKeywordGapAnalysis(gapSection, statusDiv);

        if (parsedSourcesMemory.length > 0) {
            statusDiv.innerText = "📐 در حال ساخت ماتریس ساختاری URLها...";
            await yieldToMain();
            renderMegaMatrixTable(urlMatrixSection);

            statusDiv.innerText = "🔤 در حال تحلیل چگالی کلمات کلیدی...";
            await yieldToMain();
            renderPerUrlPhraseTable(globalPerSourcePhrases, phraseResultsSection);
        }

        statusDiv.innerText = "❓ در حال تحلیل نیت کاربران (PASF & PAAF)...";
        await yieldToMain();
        await renderIntentAnalysisSection(intentSection);

        statusDiv.innerText = "🔍 در حال استخراج شکاف‌های تفکیک‌شده...";
        await yieldToMain();
        await renderDetailedGapSections(detailedGapsSection, statusDiv);

        statusDiv.className = "status-bar success";
        statusDiv.style.display = "block";
        statusDiv.innerText = `🚀 تحلیل جامع با موفقیت انجام شد! (${targetKeywordsList.length} کلمه کلیدی پردازش شد)`;

    } catch (error) {
        console.error("Workflow Error:", error);
        statusDiv.className = "status-bar error";
        statusDiv.style.display = "block";
        statusDiv.innerText = "⚠️ خطا در پردازش: " + (typeof error === "string" ? error : error.message);
    } finally {
        startBtn.disabled = false;
    }
}

function parseOurPageContent(inputContent) {
    if (inputContent.includes('<') && inputContent.includes('>')) {
        return parseHtmlDocument("صفحه وب خودی (Our Page)", inputContent);
    } else {
        const pureBodyText = stripCorpusExcludedPhrases(inputContent.replace(/\s+/g, " ").trim());
        const fullTextLower = normalizeText(pureBodyText);
        const tokens = tokenizeText(pureBodyText);
        return {
            label: "صفحه وب خودی (Our Page)",
            domain: "",
            title: "",
            metaDesc: "",
            h1s: [],
            h2s: [],
            h3s: [],
            headingsOutline: [],
            altTexts: [],
            anchorTexts: [],
            pureBodyText,
            fullCombinedText: pureBodyText,
            searchableText: pureBodyText,
            densityText: pureBodyText,
            bodyTokens: tokens,
            fullTextLower,
            tokens
        };
    }
}

// دامنه منبع (رقیب) را به‌صورت خودکار از خود کد HTML واردشده تشخیص می‌دهد؛
// نیازی به وارد کردن دستی دامنه توسط کاربر نیست.
function extractDomainFromHtml(doc, rawHtml) {
    const toHost = (rawUrl) => {
        if (!rawUrl || !/^https?:\/\//i.test(rawUrl.trim())) return '';
        try {
            const host = new URL(rawUrl.trim()).hostname.replace(/^www\./i, '');
            return host || '';
        } catch (e) {
            return '';
        }
    };

    // اولویت اول: تگ‌هایی که خودِ صفحه آدرس رسمی خودش را در آن‌ها اعلام می‌کند
    const canonical = doc.querySelector('link[rel="canonical"]')?.getAttribute('href');
    let host = toHost(canonical);
    if (host) return host;

    const ogUrl = doc.querySelector('meta[property="og:url"]')?.getAttribute('content');
    host = toHost(ogUrl);
    if (host) return host;

    const baseHref = doc.querySelector('base[href]')?.getAttribute('href');
    host = toHost(baseHref);
    if (host) return host;

    // اولویت دوم: پرتکرارترین دامنه خارجی موجود در لینک‌های مطلق داخل کد صفحه
    // (معمولاً همان دامنه‌ای‌ست که صفحه در لینک‌های داخلی/canonical خودش به کار می‌برد)
    const ignoreHosts = /google|gstatic|googleapis|googletagmanager|google-analytics|doubleclick|recaptcha|facebook|fbcdn|instagram|twitter|x\.com|linkedin|youtube|youtu\.be|schema\.org|w3\.org|wp\.com|gravatar|cloudflare|jsdelivr|unpkg|bootstrapcdn|fontawesome|typekit|aparat\.com|t\.me|telegram/i;
    const matches = rawHtml.match(/https?:\/\/[^\s"'<>)]+/g) || [];
    const freq = new Map();
    matches.forEach(m => {
        const h = toHost(m);
        if (h && !ignoreHosts.test(h)) {
            freq.set(h, (freq.get(h) || 0) + 1);
        }
    });
    if (freq.size) {
        return Array.from(freq.entries()).sort((a, b) => b[1] - a[1])[0][0];
    }

    return '';
}

function parseHtmlDocument(label, htmlContent) {
    // جلوگیری از چسبیدن کلمات دو تگ مجاور به هم (مثلاً </h2><p>) هنگام استخراج textContent
    const safeHtmlContent = htmlContent.replace(/>(?=<)/g, "> ");

    const parser = new DOMParser();
    const doc = parser.parseFromString(safeHtmlContent, "text/html");
    const domain = extractDomainFromHtml(doc, htmlContent);

    const title = doc.querySelector("title")?.textContent.trim() || "";
    const metaDesc = doc.querySelector('meta[name="description"]')?.getAttribute("content")?.trim() || "";
    const h1s = Array.from(doc.querySelectorAll("h1")).map(el => el.textContent.trim()).filter(Boolean);
    const h2s = Array.from(doc.querySelectorAll("h2")).map(el => el.textContent.trim()).filter(Boolean);
    const h3s = Array.from(doc.querySelectorAll("h3")).map(el => el.textContent.trim()).filter(Boolean);
    // ساختار واقعی و سلسله‌مراتبی عناوین: همهٔ h1 تا h6 به ترتیب واقعی ظاهرشدن در سند،
    // به همراه سطح هر عنوان (برای رندر تورفتگی/nesting صحیح در ماتریس مقایسه)
    const headingsOutline = Array.from(doc.querySelectorAll("h1, h2, h3, h4, h5, h6"))
        .map(el => ({ level: Number(el.tagName.substring(1)), text: el.textContent.trim() }))
        .filter(h => h.text);
    const altTexts = Array.from(doc.querySelectorAll("img"))
        .map(img => img.getAttribute("alt"))
        .filter(alt => alt && alt.trim())
        .map(alt => alt.trim());
    const anchorTexts = Array.from(doc.querySelectorAll("a"))
        .map(el => el.textContent.trim())
        .filter(Boolean);

    const cleanDoc = doc.cloneNode(true);
    cleanDoc.querySelectorAll("script, style, svg, path, iframe, nav, header, footer, noscript, link, head, dialog").forEach(el => el.remove());
    const pureBodyText = stripCorpusExcludedPhrases(cleanDoc.body ? cleanDoc.body.textContent.replace(/\s+/g, " ").trim() : "");

    // ---------------------------------------------------------------
    // متنِ «کاملِ قابل جست‌وجو» برای تحلیل پوشش/عدم پوشش کلمات کلیدی
    // (هر کلمه‌ای که کاربر یا موتور جست‌وجو می‌بیند باید اینجا باشد:
    //  متن ساده، دکمه‌ها، منو/هدر/فوتر، alt تصاویر، title/aria-label،
    //  placeholder، value دکمه‌ها و اینپوت‌ها، option ها، متاهای مهم،
    //  و حتی داده‌های ساختاریافته JSON-LD)
    // ---------------------------------------------------------------
    const searchDoc = doc.cloneNode(true);
    // فقط چیزهایی که واقعاً محتوای زبانی ندارند حذف می‌شوند
    searchDoc.querySelectorAll("style, svg, path, noscript").forEach(el => el.remove());
    searchDoc.querySelectorAll("script").forEach(el => {
        const type = (el.getAttribute("type") || "").toLowerCase();
        // اسکریپت‌های داده‌ای (JSON-LD) حاوی متن معنادار هستند و باید بمانند
        if (!/ld\+json|application\/json/.test(type)) el.remove();
    });

    const visibleTextAll = stripCorpusExcludedPhrases(searchDoc.body
        ? searchDoc.body.textContent.replace(/\s+/g, " ").trim()
        : "");

    // متن درون همهٔ اتریبیوت‌های معنادار در کل سند
    const TEXT_ATTRS = [
        "alt", "title", "aria-label", "aria-description", "aria-placeholder",
        "aria-valuetext", "aria-roledescription", "placeholder", "label",
        "value", "data-title", "data-label", "data-text", "data-tooltip",
        "data-original-title", "data-alt", "data-caption", "summary"
    ];
    const attrTextParts = [];
    searchDoc.querySelectorAll("*").forEach(el => {
        const tag = el.tagName.toLowerCase();
        TEXT_ATTRS.forEach(attr => {
            if (!el.hasAttribute(attr)) return;
            // value فقط برای عناصری که واقعاً متنِ دیده‌شده دارند (دکمه‌ها، آپشن‌ها،
            // و اینپوت‌های متنی) — نه برای hidden/password/number
            if (attr === "value") {
                const type = (el.getAttribute("type") || "").toLowerCase();
                if (tag === "input" && ["hidden", "password", "file", "checkbox", "radio"].includes(type)) return;
                if (tag !== "input" && tag !== "button" && tag !== "option") return;
            }
            const v = el.getAttribute(attr);
            if (v && v.trim() && !/^https?:\/\//i.test(v.trim())) attrTextParts.push(v.trim());
        });
    });

    // متاهای معنادار (description، keywords، og، twitter و ...)
    const metaTextParts = Array.from(doc.querySelectorAll("meta"))
        .filter(m => {
            const key = (m.getAttribute("name") || m.getAttribute("property") || m.getAttribute("itemprop") || "").toLowerCase();
            return /description|keywords|title|og:|twitter:|subject|abstract|news_keywords/.test(key);
        })
        .map(m => (m.getAttribute("content") || "").trim())
        .filter(v => v && !/^https?:\/\//i.test(v));

    const searchableText = stripCorpusExcludedPhrases([
        title,
        metaDesc,
        metaTextParts.join(" | "),
        visibleTextAll,
        altTexts.join(" | "),
        anchorTexts.join(" | "),
        attrTextParts.join(" | ")
    ].filter(Boolean).join(" | "));

    // fullCombinedText اکنون همان متن کاملِ قابل جست‌وجوست تا هیچ کلمه‌ای از قلم نیفتد
    const fullCombinedText = searchableText;

    // ---------------------------------------------------------------
    // متن مخصوص «شمارش تکرار و چگالی» (بخش ۵)
    // این متن با متن جست‌وجو فرق دارد: در متن جست‌وجو عمداً alt، anchor و
    // اتریبیوت‌ها دوباره الحاق می‌شوند تا هیچ کلمه‌ای از قلم نیفتد، ولی همان
    // تکرار مصنوعی باعث می‌شد تعداد و درصد چگالی چند برابرِ واقعیت شمرده شود
    // (مثلاً متن یک لینک هم در visibleText بود هم در anchorTexts).
    // اینجا هر بخش فقط یک‌بار می‌آید: Title، Meta Description، متن دیدهٔ کاربر،
    // و alt تصاویر (که در متن دیده نمی‌شود و تکراری نیست).
    // ---------------------------------------------------------------
    const densityText = stripCorpusExcludedPhrases([
        title,
        metaDesc,
        visibleTextAll,
        altTexts.join(" | ")
    ].filter(Boolean).join(" | "));

    const fullTextLower = normalizeText(fullCombinedText);
    const tokens = tokenizeText(fullCombinedText);
    // توکن‌های متن اصلی بدنه (برای شمارش واقعی تعداد کلمات محتوا، نه پوشش)
    const bodyTokens = tokenizeText(pureBodyText);

    return {
        label, domain, title, metaDesc, h1s, h2s, h3s, headingsOutline, altTexts, anchorTexts, pureBodyText, fullCombinedText,
        searchableText, densityText, bodyTokens,
        localTitleLower: normalizeText(title),
        localMetaDescLower: normalizeText(metaDesc),
        localH1sLower: h1s.map(normalizeText),
        fullTextLower,
        tokens
    };
}

function phraseExists(phrase, sourceObjOrText) {
    if (!phrase) return false;
    
    let phraseTokens = tokenizeText(phrase);
    if (!phraseTokens.length) return false;

    let textTokens = [];
    if (typeof sourceObjOrText === 'object' && sourceObjOrText !== null && sourceObjOrText.tokens) {
        textTokens = sourceObjOrText.tokens;
    } else {
        textTokens = tokenizeText(typeof sourceObjOrText === 'string' ? sourceObjOrText : '');
    }

    if (phraseTokens.length > textTokens.length) return false;

    outer:
    for (let i = 0; i <= textTokens.length - phraseTokens.length; i++) {
        for (let j = 0; j < phraseTokens.length; j++) {
            if (textTokens[i + j] !== phraseTokens[j]) continue outer;
        }
        return true;
    }
    return false;
}

// تطابق یک عبارت با لیست تحقیق کلمات کلیدی (Keyword Research).
// این تطابق عمداً «دقیق و کامل» است، نه شامل‌شدن (substring) به هیچ جهتی؛
// یعنی عبارت باید کلمه‌به‌کلمه، با همان فاصله‌ها و نیم‌فاصله‌ها (ZWNJ)، دقیقاً
// برابر یکی از کلمات کلیدی وارد شده باشد تا بج KR بگیرد. مثلاً "کفش مردانه"
// و "خرید کفش مردانه چرم" دو عبارت متفاوت‌اند و نباید هر دو بج KR بگیرند.
// چون normalizeText فاصله و نیم‌فاصله را با هم یکی نمی‌کند، این تفاوت‌ها در
// همین تطابق دقیق هم به‌درستی حفظ می‌شوند.
// نکته مهم: این تابع تنها و یگانه منبع تطابق KR در کل داشبورد است — قبلاً
// بخش‌های مختلف (بخش ۲، ۳، ۶ و ۷) هرکدام این تطابق را جداگانه و با منطق
// متفاوتی پیاده‌سازی کرده بودند، که باعث می‌شد یک عبارت واحد بسته به اینکه
// در کدام بخش رندر می‌شود، برچسب/امتیاز متفاوتی بگیرد.
function matchesTargetKeywords(phraseNorm) {
    if (!phraseNorm) return false;
    return targetKeywordsNormalizedSet.has(phraseNorm);
}

// همان قانون تطابق دقیق KR، برای کوئری‌های گوگل سرچ کنسول، PASF و PAAF هم اعمال می‌شود:
// عبارت باید کلمه‌به‌کلمه (با همان فاصله/نیم‌فاصله) دقیقاً برابر یک ردیف از آن لیست باشد،
// نه صرفاً زیررشته‌ی آن یا شامل آن. این سه تابع هم — مثل matchesTargetKeywords — تنها و
// یگانه منبع تطابق GSC/PASF/PAAF در کل داشبورد هستند.
function matchesGscQueries(phraseNorm) {
    if (!phraseNorm) return false;
    return gscQueriesMap.has(phraseNorm);
}

function matchesPasf(phraseNorm) {
    if (!phraseNorm) return false;
    return pasfNormalizedSet.has(phraseNorm);
}

function matchesPaaf(phraseNorm) {
    if (!phraseNorm) return false;
    return paafNormalizedSet.has(phraseNorm);
}

function computeMultiSourceFootprintScore(phrase) {
    const phraseNorm = keyOf(phrase);
    if (!phraseNorm) return { score: 0, badges: [] };

    let score = 5;
    let foundBadges = [];

    if (matchesTargetKeywords(phraseNorm)) {
        if (!foundBadges.includes('KR')) foundBadges.push('KR');
        score += 20;
    }

    let gscMatches = [];
    parsedGscData.forEach(g => {
        if (g.normQuery === phraseNorm) {
            gscMatches.push(g);
        }
    });

    if (gscMatches.length > 0) {
        if (!foundBadges.includes('GSC')) foundBadges.push('GSC');
        score += 25 + Math.min(gscMatches.length * 5, 25);
    }

    competitorSources.forEach((comp, index) => {
        if (phraseExists(phraseNorm, comp)) {
            const compLabel = `C${comp.slot}`;
            if (!foundBadges.includes(compLabel)) foundBadges.push(compLabel);
            score += 15;
        }
    });

    if (matchesPasf(phraseNorm)) {
        if (!foundBadges.includes('PASF')) foundBadges.push('PASF');
        score += 20;
    }

    if (matchesPaaf(phraseNorm)) {
        if (!foundBadges.includes('PAAF')) foundBadges.push('PAAF');
        score += 20;
    }

    const finalScore = Math.round(score);
    return { score: finalScore, badges: foundBadges };
}

// محاسبهٔ «تعداد حضور در سکشن‌ها» دقیقاً با همان منطق بخش ۲
// (۱۰۰ کلمه و عبارت کلیدی برتر برای پوشش محتوایی).
// خروجی: لیست برچسب‌ها + تعداد سکشن‌هایی که عبارت در آن‌ها حضور دارد.
// بخش‌های شکاف کلمات کلیدی هم از همین تابع استفاده می‌کنند تا معیار
// مرتب‌سازی در کل داشبورد یکسان باشد.
function computePresenceBadges(phrase) {
    const phraseNorm = keyOf(phrase);
    const badges = new Set();
    if (!phraseNorm) return { badges: [], presenceCount: 0 };

    if (matchesTargetKeywords(phraseNorm)) {
        badges.add('KR');
    }

    if (matchesGscQueries(phraseNorm)) {
        badges.add('GSC');
    }

    competitorSources.forEach((comp, idx) => {
        if (phraseExists(phraseNorm, comp)) {
            badges.add(`C${comp.slot}`);
        }
    });

    if (matchesPasf(phraseNorm)) badges.add('PASF');
    if (matchesPaaf(phraseNorm)) badges.add('PAAF');

    const list = Array.from(badges);
    return { badges: list, presenceCount: list.length };
}

function getBadgeHtml(b) {
    let bClass = 'badge-comp';
    let titleAttr = '';
    if (b === 'Target') { bClass = 'badge-target'; titleAttr = 'در لیست تحقیق کلمات کلیدی وجود دارد'; }
    else if (b === 'KR') { bClass = 'badge-kr'; titleAttr = 'در لیست تحقیق کلمات کلیدی (Keyword Research) وجود دارد'; }
    else if (b === 'GSC') { bClass = 'badge-gsc'; titleAttr = 'در گزارش گوگل سرچ کنسول وجود دارد'; }
    else if (b === 'PASF') { bClass = 'badge-pasf'; titleAttr = 'در جستجوهای مرتبط (PASF) وجود دارد'; }
    else if (b === 'PAAF') { bClass = 'badge-paaf'; titleAttr = 'در سوالات پرتکرار کاربران (PAAF) وجود دارد'; }
    else if (b.startsWith('C')) {
        bClass = 'badge-' + b.toLowerCase();
        const slotNo = parseInt(b.substring(1), 10);
        const comp = competitorSources.find(c => c.slot === slotNo);
        titleAttr = comp ? (comp.domain ? `در صفحه رقیب: ${comp.domain}` : `در صفحه ${comp.label} وجود دارد`) : `رقیب شماره ${b.substring(1)}`;
    }
    return `<span class="badge ${bClass}" title="${escapeHtml(titleAttr)}">${b}</span>`;
}

// می‌سازد فهرست یکپارچه‌ی همه‌ی عبارات موجود در ورودی‌های «لیستی» کاربر:
// لیست تحقیق کلمات کلیدی (KR) + کوئری‌های گوگل سرچ کنسول (GSC) + PASF + PAAF.
// عمداً محتوای صفحه‌ی خودمان و محتوای رقبا در اینجا تولیدکننده‌ی عبارت جدید
// نیستند — رقبا فقط برای این استفاده می‌شوند که آیا هرکدام از این عبارات را
// پوشش داده‌اند یا نه (بج C1، C2 و...)، نه برای ساختن عبارت تازه.
// نتیجه‌ی این تابع فقط یک‌بار در کل فرایند تحلیل محاسبه و کش می‌شود و بین
// بخش ۲ (کلمات پیشنهادی)، بخش ۳ (شکاف کلمات) و بخش ۷ (شکاف تفکیک‌شده)
// به اشتراک گذاشته می‌شود — هم برای جلوگیری از محاسبه‌ی تکراری، و هم تا
// معیار «تعداد حضور در سکشن‌ها» در کل داشبورد دقیقاً یکسان بماند.
let cachedAllInputCandidates = [];

async function buildAllInputCandidates(statusDiv) {
    const candidateMap = new Map();

    function registerPhrase(phrase, badgeName) {
        if (!phrase) return;
        const norm = keyOf(phrase);
        if (!norm) return;
        if (!candidateMap.has(norm)) {
            candidateMap.set(norm, { phrase: phrase.trim(), badges: new Set() });
        }
        candidateMap.get(norm).badges.add(badgeName);
    }

    targetKeywordsList.forEach(k => registerPhrase(k, 'KR'));
    parsedGscData.forEach(g => registerPhrase(g.query, 'GSC'));
    pasfList.forEach(p => registerPhrase(p, 'PASF'));
    paafList.forEach(p => registerPhrase(p, 'PAAF'));

    const allPhrases = Array.from(candidateMap.values());
    const chunkSize = 300;

    for (let i = 0; i < allPhrases.length; i += chunkSize) {
        const chunk = allPhrases.slice(i, i + chunkSize);

        chunk.forEach(item => {
            const phraseNorm = keyOf(item.phrase);

            competitorSources.forEach((comp, idx) => {
                if (phraseExists(phraseNorm, comp)) {
                    item.badges.add(`C${comp.slot}`);
                }
            });

            if (matchesGscQueries(phraseNorm)) {
                item.badges.add('GSC');
            }

            if (matchesTargetKeywords(phraseNorm)) {
                item.badges.add('KR');
            }

            if (matchesPasf(phraseNorm)) item.badges.add('PASF');
            if (matchesPaaf(phraseNorm)) item.badges.add('PAAF');
        });

        if (allPhrases.length > 500 && statusDiv) {
            statusDiv.innerText = `⏳ در حال ارزیابی عبارات ورودی: ${Math.min(i + chunkSize, allPhrases.length)} از ${allPhrases.length}...`;
            await yieldToMain();
        }
    }

    return Array.from(candidateMap.values()).map(item => ({
        phrase: item.phrase,
        badges: Array.from(item.badges),
        presenceCount: item.badges.size,
        impressions: (gscQueriesMap.get(keyOf(item.phrase)) || []).reduce((sum, g) => sum + g.impressions, 0)
    }));
}
